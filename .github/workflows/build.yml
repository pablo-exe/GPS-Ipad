name: Build MVP
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-runtime:
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: GPS-Sender-Android
          path: artifacts/runtime-apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test GNSS service with locked screen and Doze
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7_pro
          disable-animations: true
          script: python3 tests/android_runtime.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-runtime-evidence
          path: artifacts/android-runtime

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test real TCP server with synthetic fixes
        run: |
          mkdir -p /tmp/gps-tests
          javac -d /tmp/gps-tests android/app/src/main/java/es/pablo/gpsbridge/GpsServer.java tests/java/es/pablo/gpsbridge/GpsServerTest.java
          java -cp /tmp/gps-tests es.pablo.gpsbridge.GpsServerTest
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile installable debug APK and lint
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GPS-Sender-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-lint
          path: android/app/build/reports/lint-results-debug.html

  ios:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test stream framing and freshness
        run: |
          swiftc ios/GPSBridge/Protocol.swift ios/GPSBridge/InjectionWorker.swift tests/swift/main.swift -o /tmp/gps-protocol-tests
          /tmp/gps-protocol-tests
      - name: Download pinned FFI (hash checked)
        run: python3 scripts/prepare_ios_vendor.py
      - name: Generate project
        run: |
          brew install xcodegen
          cd ios
          xcodegen generate
      - name: Build iPad/iPhone device app (unsigned)
        run: |
          xcodebuild -version
          xcodebuild -project ios/GPSBridge.xcodeproj -scheme GPSBridge \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath artifacts/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package IPA for signing and sideloading
        run: |
          mkdir -p artifacts/Payload
          cp -R artifacts/DerivedData/Build/Products/Release-iphoneos/GPSBridge.app artifacts/Payload/
          cp README.md THIRD_PARTY_NOTICES.md artifacts/
          cd artifacts
          /usr/bin/zip -qry GPS-Bridge-unsigned.ipa Payload
          shasum -a 256 GPS-Bridge-unsigned.ipa > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: GPS-Bridge-iOS-unsigned
          path: |
            artifacts/GPS-Bridge-unsigned.ipa
            artifacts/SHA256SUMS.txt
            artifacts/README.md
            artifacts/THIRD_PARTY_NOTICES.md
          if-no-files-found: error
          retention-days: 14
