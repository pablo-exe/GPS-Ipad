name: GPSBridge
options:
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
targets:
  GPSBridge:
    type: application
    platform: iOS
    sources: [GPSBridge]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.pablo.gpsbridge
        PRODUCT_NAME: GPSBridge
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: GPSBridge/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_STYLE: Automatic
        SWIFT_INCLUDE_PATHS: "$(PROJECT_DIR)/Vendor/idevice"
        HEADER_SEARCH_PATHS: "$(PROJECT_DIR)/Vendor/idevice"
        LIBRARY_SEARCH_PATHS: "$(PROJECT_DIR)/Vendor/idevice"
        OTHER_LDFLAGS: ["$(inherited)", "-lidevice_ffi", "-lc++", "-lz"]
        SUPPORTS_MACCATALYST: false
        ENABLE_BITCODE: false
