    <text x="64" y="288" fill="#f4f5eb" font-size="44" font-weight="600" letter-spacing="-1">on your iPad's maps.</text>
    <text x="64" y="365" fill="#b8cecb" font-size="25">Two native apps. One Wi-Fi connection.</text>
