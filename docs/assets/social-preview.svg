<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">GPS Bridge</title>
  <desc id="desc">Your Android's GPS, on your iPad's maps. Illustration of the Wi-Fi and Core Location data flow. Experimental project, version 0.2.</desc>
  <rect width="1200" height="630" fill="#102a30"/>
  <path d="M0 582h1200" stroke="#345057" stroke-width="1"/>
